  <style>
    * { box-sizing: border-box; }
    html { font: 16px system-ui, sans-serif; color: #242421; background: #f5f3ed; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image: radial-gradient(#a39c8d61 .8px, transparent .9px);
      background-size: 17px 17px;
    }
    main { width: min(100%, 400px); padding: clamp(21px, 6vw, 34px); border: 1px solid #d5d2c7; border-radius: 13px; background: #fffefa; box-shadow: 0 12px 32px #2a221916; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 24px; color: #625a50; font: 600 11px ui-monospace, monospace; letter-spacing: .07em; text-transform: uppercase; }
    .mark { width: 34px; height: 34px; border-radius: 9px; background: #c6422c; color: #fff8ee; padding: 7px; }
    h1 { margin: 0; font-size: clamp(27px, 7vw, 35px); line-height: 1.05; letter-spacing: -.05em; }
    .description { margin: 9px 0 21px; color: #605a50; font-size: 14px; line-height: 1.5; }
    form { display: grid; gap: 8px; }
    label { font-weight: 700; font-size: 13px; }
    input[type="password"], button { min-height: 43px; border-radius: 7px; font: inherit; }
    input[type="password"] { width: 100%; border: 1px solid #c9c2b6; background: #fffefa; padding: 8px 10px; }
    .remember { display: flex; align-items: center; gap: 8px; color: #554f45; min-height: 34px; font-weight: 500; cursor: pointer; }
    .remember input { accent-color: #a63b28; width: 17px; height: 17px; margin: 0; }
    button { margin-top: 4px; border: 0; background: #282823; color: #fffefa; font-weight: 700; font-size: 14px; cursor: pointer; }
    button:hover:not(:disabled) { background: #414138; }
    button:disabled { opacity: .65; cursor: default; }
    :focus-visible { outline: 2px solid #a63b28; outline-offset: 3px; }
    .message { min-height: 18px; color: #a63825; margin: 2px 0 0; font-size: 12px; }
  </style>

  <script>(() => {
  "use strict";

  const database = "common-aim-pages-unlock";
  const storeName = "keys";
  const recordId = "studio";
  const rememberFor = 30 * 24 * 60 * 60 * 1000;

  function run(mode, action) {
    return new Promise((resolve, reject) => {
      const opening = indexedDB.open(database, 1);
      opening.onupgradeneeded = () => opening.result.createObjectStore(storeName);
      opening.onerror = () => reject(opening.error);
      opening.onsuccess = () => {
        const db = opening.result;
        try {
          const transaction = db.transaction(storeName, mode);
          const request = action(transaction.objectStore(storeName));
          transaction.oncomplete = () => {
            db.close();
            resolve(request.result);
          };
          transaction.onabort = () => {
            db.close();
            reject(transaction.error);
          };
        } catch (error) {
          db.close();
          reject(error);
        }
      };
    });
  }

  window.CommonAimPagesSession = {
    read: () => run("readonly", store => store.get(recordId)),
    save: (salt, key) => run("readwrite", store => store.put({ salt, key, until: Date.now() + rememberFor }, recordId)),
    forget: () => run("readwrite", store => store.delete(recordId))
  };
})();
</script>
  <script>
    const form = document.getElementById("unlock");
    const field = document.getElementById("password");
    const remember = document.getElementById("remember");
    const message = document.getElementById("message");
    const button = form.querySelector("button");
    const bundle = JSON.parse(document.getElementById("bundle").textContent);
    const session = window.CommonAimPagesSession;
    const fromBase64 = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));

    async function decrypt(key) {
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(bundle.iv) }, key, fromBase64(bundle.data));
      return new TextDecoder("utf-8", { fatal: true }).decode(decrypted);
    }

    function openStudio(app) {
      if (location.hash === "#locked") history.replaceState(null, "", location.pathname + location.search);
      document.open();
      document.write(app);
      document.close();
    }

    async function tryRememberedUnlock() {
      if (location.hash === "#locked") return;
      try {
        const saved = await session.read();
        if (!saved) return;
        if (saved.salt === bundle.salt && saved.until > Date.now()) {
          openStudio(await decrypt(saved.key));
          return;
        }
        await session.forget();
      } catch {
        // A blocked or unreadable database still allows password entry.
      }
    }

    if (!window.crypto?.subtle) {
      field.disabled = true;
      remember.disabled = true;
      message.textContent = "Open this page over HTTPS to unlock it.";
    } else {
      tryRememberedUnlock().finally(() => { button.disabled = false; });
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (button.disabled) return;
      field.removeAttribute("aria-invalid");
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Unlocking…";
      const password = new TextEncoder().encode(field.value);
      const keepUnlocked = remember.checked;
      field.value = "";
      let key;
      let app;
      try {
        const input = await crypto.subtle.importKey("raw", password, "PBKDF2", false, ["deriveKey"]);
        key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt: fromBase64(bundle.salt), iterations: bundle.iterations },
          input, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        app = await decrypt(key);
      } catch {
        field.setAttribute("aria-invalid", "true");
        message.textContent = "That password didn’t match. Try again.";
        button.disabled = false;
        button.textContent = "Unlock studio";
        field.focus();
        return;
      } finally {
        password.fill(0);
      }
      const update = keepUnlocked ? session.save(bundle.salt, key) : session.forget();
      await update.catch(() => {});
      openStudio(app);
    });
  </script>
